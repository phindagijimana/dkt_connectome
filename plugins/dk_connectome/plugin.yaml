# =============================================================================
# Stage 4 plugin — DK connectome
# =============================================================================
# Build an 84x84 Desikan-Killiany structural connectome from QSIRecon's
# tractogram and FreeSurfer's aparc+aseg parcellation. Runs inside the
# dedicated dk-connectome.sif (~900 MB; built from this repo, published to
# ghcr.io). Tools used:
#
#   mrconvert              MGZ -> NIfTI (MRtrix native; replaces mri_convert
#                          so no FreeSurfer license needed for this step)
#   antsApplyTransforms    resample aparc+aseg onto the DWI grid using
#                          QSIPrep's ITK xfm (the .lta/.txt BIDS suffix is
#                          misleading — it's actually ITK text format)
#   labelconvert           DK 0..255 -> 0..N MRtrix indexing
#   tck2connectome         the matrix itself
#   mrinfo / tckinfo       space-alignment diagnostics
#
# FreeSurferColorLUT.txt is baked into the image (pinned to FS v7.4.1 from
# upstream's open-source GitHub distribution).
# =============================================================================

name: dk_connectome
version: 1.0.0
description: 84x84 Desikan-Killiany structural connectome from QSIRecon tractogram.
order: 4

provides:
  - dk_target                  # dk_connectomes/sub-XXX/dk_connectome.csv

requires:
  containers: [dk_connectome]  # MRtrix3 + ANTs + baked-in FS color LUT
  config: [results_root]
  plugins: [qsirecon, recon]

options:
  resample_to_dwi:
    default: true
    description: |
      Resample aparc+aseg onto the DWI/T1w grid via antsApplyTransforms -n
      GenericLabel before labelconvert. Disabling produces a connectome in FS
      conformed space, which may be mis-aligned to the tractogram.

  tck2connectome_extra:
    default: []
    description: |
      Extra flags for MRtrix3 tck2connectome, e.g.
        [-scale_invlength, -scale_invnodevol]

  fs_lut:
    default: null
    description: |
      Optional host-side FreeSurferColorLUT.txt to bind-mount over the
      baked-in copy. Useful for pinning to a specific FreeSurfer release.
      Leave unset to use the image's baked-in LUT.

resources:
  threads: 2
  mem_mb: 8000
  runtime_min: 30

rules: rules.smk
