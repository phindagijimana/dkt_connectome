site_name: DKT Connectome
site_description: Lesion-aware structural connectomics BIDS App — science, methods, and user guide (QSIPrep → inpaint → recon → QSIRecon → DKT connectome → disconnectome)
site_url: https://dkt-connectome.readthedocs.io/
repo_url: https://github.com/phindagijimana/dkt_connectome
repo_name: phindagijimana/dkt_connectome
edit_uri: edit/main/dwi_pipeline/docs/
copyright: Copyright &copy; 2026 Philbert Ndagijimana and contributors. All rights reserved.

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides

nav:
  - Home: index.md
  - Getting started:
    - How it works (science): science_overview.md
    - Installation: installation.md
    - Tutorial: tutorial.md
    - Sample data (IDEAS): datasets/ideas.md
    - Cloud & group deployment: cloud_deployment.md
  - Using the pipeline:
    - Usage: usage.md
    - Decision tables: decision_tables.md
    - BIDS App: bids_app.md
    - Containers: containers.md
  - Your data:
    - Preparing your data: preparing_data.md
    - BIDS metadata & repair: bids_metadata.md
    - Lesion masks: lesion_segmentation.md
  - Methods:
    - Step-by-step methods: methods/index.md
    - Step 1 — QSIPrep: methods/step1_qsiprep.md
    - Step 1.5 — Inpainting: methods/step1_5_inpaint.md
    - Step 2 — Recon: methods/step2_recon.md
    - Step 3 — Tractography: methods/step3_qsirecon.md
    - Step 4 — Connectome: methods/step4_connectome.md
    - Step 4.5 — Disconnectome: methods/step4_5_disconnectome.md
    - Step 5 — Node strength: methods/step5_node_strength.md
  - Outputs & QC:
    - Outputs: outputs.md
    - Derivatives export: derivatives.md
    - Visual QC guide: visual_qc.md
    - QC dashboard: qc_dashboard.md
    - Disconnectome: disconnectome.md
  - Reference:
    - Configuration: configuration.md
    - Pipeline steps: pipeline_steps.md
    - Validation: validation.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
    - Comparisons: comparisons.md
    - References by step: references.md
    - Citation: citation.md
    - License: license.md
    - Changelog: changelog.md
  - Developer:
    - Contributing: contributing.md
    - Snakemake workflow: snakemake_workflow.md
    - Configuration catalog: config_catalog.md
    - Schema reference: schema_reference.md
  - Maintainer:
    - One-shot tasks (release, Docker, RTD): maintainer/maintainer_tasks.md
    - Integration CI (real containers): maintainer/integration_ci.md
    - v1.0 science track: maintainer/v1_science_track.md
    - Container digests (S4): maintainer/container_digests.md
    - BIDS App submission (optional): BIDS_App.md
    - Readiness checklist: maintainer/readiness_checklist.md
    - What's remaining: maintainer/remaining.md
    - Publishing: maintainer/publishing.md

plugins:
  - search
  - redirects:
      redirect_maps:
        quickstart.md: tutorial.md
        preprocessing.md: preparing_data.md
        integrity_qc.md: disconnectome.md#integrity-qc
        getting_help.md: index.md#help
        advanced/theory_deep_dive.md: science_overview.md
        bids_apps_registry.md: BIDS_App.md
        fieldmaps_sdc.md: preparing_data.md#fieldmaps-and-sdc
        readthedocs_setup.md: maintainer/maintainer_tasks.md#14-read-the-docs-auto-rebuild

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
