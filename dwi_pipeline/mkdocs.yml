site_name: DKT Connectome
site_description: Lesion-aware structural connectomics BIDS App — science, methods, and user guide (QSIPrep → inpaint → recon → QSIRecon → DKT connectome → disconnectome)
site_url: https://dkt-connectome.readthedocs.io/
repo_url: https://github.com/phindagijimana/dkt_connectome
repo_name: phindagijimana/dkt_connectome
site_author: Philbert Ndagijimana
edit_uri: edit/main/dwi_pipeline/docs/
copyright: Copyright &copy; 2026 Inzira Labs, University of Rochester and contributors. All rights reserved.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phindagijimana/dkt_connectome
      name: GitHub repository
    - icon: fontawesome/solid/envelope
      link: mailto:phindagiji@gmail.com
      name: Email maintainer

docs_dir: docs

# Maintainer runbooks, registry submission, and auto-generated config dumps — GitHub only (see contributing.md).
exclude_docs: |
  maintainer/*
  config_catalog.md
  schema_reference.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides

nav:
  - Home: index.md
  - Getting started:
    - How it works (science): science_overview.md
    - Installation: installation.md
    - Tutorial: tutorial.md
    - Sample data (IDEAS): datasets/ideas.md
    - Cloud & group deployment: cloud_deployment.md
  - Using the pipeline:
    - Usage: usage.md
    - Decision tables: decision_tables.md
    - BIDS App specification: bids_app.md
    - Containers: containers.md
  - Your data:
    - Preparing your data: preparing_data.md
    - BIDS metadata & repair: bids_metadata.md
    - Lesion masks: lesion_segmentation.md
  - Methods:
    - Step-by-step methods: methods/index.md
    - Step 1 — QSIPrep: methods/step1_qsiprep.md
    - Step 1.5 — Inpainting: methods/step1_5_inpaint.md
    - Step 2 — Recon: methods/step2_recon.md
    - Step 3 — Tractography: methods/step3_qsirecon.md
    - Step 3.5 — Lesion-aware ACT: methods/step3_5_lesion_act.md
    - Lesion-aware tractography: lesion_aware.md
    - Step 4 — Connectome: methods/step4_connectome.md
    - Step 4.5 — Disconnectome: methods/step4_5_disconnectome.md
    - Step 5 — Node strength: methods/step5_node_strength.md
  - Outputs & QC:
    - Quality control: qc.md
    - Outputs: outputs.md
    - Derivatives export: derivatives.md
    - Disconnectome: disconnectome.md
  - Reference:
    - Configuration: configuration.md
    - Pipeline steps: pipeline_steps.md
    - Validation: validation.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
    - Comparisons: comparisons.md
    - References by step: references.md
    - Citation: citation.md
    - License: license.md
    - Changelog: changelog.md
  - Developer:
    - Contributing: contributing.md
    - Snakemake workflow: snakemake_workflow.md

plugins:
  - search
  - redirects:
      redirect_maps:
        quickstart.md: tutorial.md
        preprocessing.md: preparing_data.md
        integrity_qc.md: disconnectome.md#integrity-qc
        getting_help.md: index.md#contact
        advanced/theory_deep_dive.md: science_overview.md
        bids_apps_registry.md: contributing.md#repository-local-documentation
        BIDS_App.md: contributing.md#repository-local-documentation
        visual_qc.md: qc.md
        qc_dashboard.md: qc.md
        fieldmaps_sdc.md: preparing_data.md#fieldmaps-and-sdc
        readthedocs_setup.md: contributing.md#repository-local-documentation
        config_catalog.md: contributing.md#repository-local-documentation
        schema_reference.md: contributing.md#repository-local-documentation
        maintainer/maintainer_tasks.md: contributing.md#repository-local-documentation
        maintainer/publishing.md: contributing.md#repository-local-documentation
        maintainer/readiness_checklist.md: contributing.md#repository-local-documentation
        maintainer/remaining.md: contributing.md#repository-local-documentation
        maintainer/integration_ci.md: contributing.md#repository-local-documentation
        maintainer/v1_science_track.md: contributing.md#repository-local-documentation
        maintainer/container_digests.md: contributing.md#repository-local-documentation
        maintainer/bids_apps_registry.md: contributing.md#repository-local-documentation

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
