<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="DKT Connectome pipeline overview">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2980b9"/>
    </marker>
    <style>
      .box { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 1.5; rx: 6; }
      .opt { fill: #fef9e7; stroke: #b7950b; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 6; }
      .title { font: 600 13px sans-serif; fill: #2c3e50; }
      .sub { font: 11px sans-serif; fill: #566573; }
      .arrow { stroke: #2980b9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="460" y="22" text-anchor="middle" class="title" font-size="15">DKT Connectome  BIDS App workflow</text>
  <rect class="box" x="10" y="40" width="100" height="52"/>
  <text x="60" y="62" text-anchor="middle" class="title">BIDS</text>
  <text x="60" y="78" text-anchor="middle" class="sub">T1w + DWI</text>
  <line class="arrow" x1="110" y1="66" x2="128" y2="66"/>
  <rect class="box" x="130" y="40" width="100" height="52"/>
  <text x="180" y="58" text-anchor="middle" class="title">Step 1</text>
  <text x="180" y="74" text-anchor="middle" class="sub">QSIPrep</text>
  <line class="arrow" x1="230" y1="66" x2="248" y2="66"/>
  <rect class="opt" x="250" y="40" width="100" height="52"/>
  <text x="300" y="58" text-anchor="middle" class="title">Step 1.5</text>
  <text x="300" y="74" text-anchor="middle" class="sub">neuroLIT</text>
  <line class="arrow" x1="350" y1="66" x2="368" y2="66"/>
  <rect class="box" x="370" y="40" width="100" height="52"/>
  <text x="420" y="58" text-anchor="middle" class="title">Step 2</text>
  <text x="420" y="74" text-anchor="middle" class="sub">Recon</text>
  <line class="arrow" x1="470" y1="66" x2="488" y2="66"/>
  <rect class="box" x="490" y="40" width="100" height="52"/>
  <text x="540" y="58" text-anchor="middle" class="title">Step 3</text>
  <text x="540" y="74" text-anchor="middle" class="sub">QSIRecon</text>
  <line class="arrow" x1="590" y1="66" x2="608" y2="66"/>
  <rect class="box" x="610" y="40" width="100" height="52"/>
  <text x="660" y="58" text-anchor="middle" class="title">Step 4</text>
  <text x="660" y="74" text-anchor="middle" class="sub">Connectome</text>
  <line class="arrow" x1="710" y1="66" x2="728" y2="66"/>
  <rect class="box" x="730" y="40" width="100" height="52"/>
  <text x="780" y="58" text-anchor="middle" class="title">Step 5</text>
  <text x="780" y="74" text-anchor="middle" class="sub">Node strength</text>
  <rect class="opt" x="610" y="120" width="130" height="52"/>
  <text x="675" y="138" text-anchor="middle" class="title">Step 4.5</text>
  <text x="675" y="154" text-anchor="middle" class="sub">Disconnectome</text>
  <line class="arrow" x1="660" y1="92" x2="675" y2="118"/>
  <text x="300" y="110" text-anchor="middle" class="sub">optional when lesion mask present</text>
  <text x="675" y="188" text-anchor="middle" class="sub">--disconnection (opt-in)</text>
  <text x="460" y="205" text-anchor="middle" class="sub">Dashed = optional steps · See Methods section for theory and citations</text>
</svg>
