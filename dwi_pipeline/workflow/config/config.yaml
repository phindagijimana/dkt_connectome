# =============================================================================
# config.yaml — Default configuration for the Snakemake plugin/workflow engine
# =============================================================================
# PipelineVersion: 0.2.0 (see CHANGELOG.md, app.json)
# =============================================================================

# --- Paths ---
results_root: /path/to/dwi_pipeline/dwi_test_TBI   # outputs; use a per-run subdir
bids_dir: /path/to/dwi_pipeline/dwi_test_TBI/bids  # local TBI test inputs
templateflow_home: null   # default: <repo>/templateflow
recon_out: null             # default: <results_root>/freesurfer  (RECON_OUT)
fs_subjects_dir: null       # default: recon_out                 (FS_SUBJECTS_DIR)
nodestrength_out: null      # default: <results_root>/node_strength

nthreads: 8
omp_nthreads: 8
output_res: 2
random_seed: 0           # --random-seed / RANDOM_SEED

# --- BIDS validation (opt-in; off by default) ---
bids:
  validate: false            # true or --bids-validation on ./run / preflight
  ignore_warnings: false     # pass --ignore-warnings to bids-validator

# --- Recommended upstream container tags (pin in config.local.yaml) ---
container_pins:
  qsiprep: pennlinc/qsiprep:1.0.0
  qsirecon: pennlinc/qsirecon:1.2.1
  freesurfer: freesurfer/freesurfer:7.4.1
  fastsurfer: deepmi/fastsurfer:latest
  connectome: ghcr.io/phindagijimana/dk-connectome:0.1.0
  lit: deepmi/lit:0.6.0
  nodestrength: ghcr.io/phindagijimana/nodestrength:0.1.0

# --- Containers (local Apptainer .sif paths) ---
containers:
  qsiprep: /path/to/others/containers/qsiprep.sif
  qsirecon: /path/to/others/containers/qsirecon.sif
  fastsurfer: /path/to/others/containers/fastsurfer_latest.sif
  freesurfer: /path/to/others/containers/freesurfer_7.4.1.sif
  connectome: /path/to/others/containers/dkt_connectome.sif
  lit: /path/to/others/containers/lit_0.6.0.sif
  nodestrength: /path/to/node_strength/containers/nodestrength_0.1.0.sif

fs_license: /path/to/others/data_mining/freesurfer/license.txt
fs_lut: null   # default: dirname(fs_license)/FreeSurferColorLUT.txt

# --- Step 1: QSIPrep ---
qsiprep:
  use_syn_sdc: false       # --syn / QSIPREP_USE_SYN_SDC=1
  fmap_retry: false        # --fmap-retry / QSIPREP_FMAP_RETRY=1
  no_sdc: false            # --no-sdc / QSIPREP_NO_SDC=1 — skip SDC entirely (matches previous CIDUR GE runs)
  bids_filter: null        # static filter JSON (--bids-filter); mutually exclusive with dwi-select

# --- DWI series selection (QSIPrep) ---
dwi_select:
  enabled: true
  shell_b: 1000
  json: null   # explicit override path; default: config/dwi_select_b<shell_b>.json

# --- Step 1.5: Inpaint (LIT) ---
inpaint:
  enabled: true            # auto-on; no-op per subject unless a lesion mask is found
  require_mask: false
  dilate: 2
  device: auto             # auto | cpu | cuda
  batch_size: 4            # 8 OOMs on gpu:l40s.6g MIG slices; use 12g/24g or lower this
  labels: all
  binarize: false
  min_outside_corr: 0.995
  max_corr_drop: 0.01
  fail_on_qc: false

# --- Step 2: Recon (recon-all / FastSurfer) ---
recon:
  enabled: true
  tool: freesurfer         # freesurfer | fastsurfer
  fsaparc: false           # --fast-fs sets tool=fastsurfer + fsaparc=true
  fastsurfer_device: cpu
  session: null            # override auto-resolved session (RECON_SESSION; bare label, e.g. 2WK)

# --- Step 3: QSIRecon ---
qsirecon:
  spec: mrtrix_singleshell_ss3t_ACT-hsvs
  atlases: ["4S156Parcels"]

# --- Step 4: Connectome ---
connectome:
  enabled: true
  parcellation: dkt         # dkt | dk | auto
  lut_dkt: null             # default: containers/connectome/mrtrix_lut/fs_dkt.txt
  fail_on_empty_nodes: false
  deterministic: true
  resample_to_dwi: true
  weighting: count          # count | sift2 — must match Step 4.5 disconnectome weighting

# --- Step 4.5: Disconnectome (auto when lesion mask + DKT connectome) ---
disconnectome:
  enabled: true
  weighting: null           # default: connectome.weighting
  core_only: false
  lesion_erode_voxels: 0
  disconnection_spared: C    # A | B | C
  option_a: true
  option_b: true
  option_c: true
  qc_html: true              # write disconnectome_qc.html after Step 4.5

# --- Unified QC dashboard (Steps 1-5) ----------------------------------------
qc:
  enabled: true
  subject_html: true         # RESULTS_ROOT/qc/sub-<ID>/subject_qc.html

# --- BIDS Derivatives export (symlink mirror under RESULTS_ROOT/derivatives) --
derivatives:
  export_enabled: true       # run export on ./run group (and --export-bids-derivatives)
  export_dir: null           # default: RESULTS_ROOT/derivatives
  export_copy: false         # true = copy files; false = symlinks (default)

# --- Step 5: Node strength / ENIGMA report ---
nodestrength:
  enabled: true             # auto-on whenever Step 4 ran
  strength_only: false
  no_report: false
