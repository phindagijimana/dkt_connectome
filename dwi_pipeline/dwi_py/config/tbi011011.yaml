# =============================================================================
# Snakemake override for sub-TBI011011 (TrackTBI dataset)
# =============================================================================
# Usage (from dwi_py/):
#   snakemake --configfile config/config.yaml --configfile config/tbi011011.yaml -n
#   sbatch submit_snakemake.sh --configfile config/tbi011011.yaml
#
# The base config (config/config.yaml) supplies container paths, thread/
# resource defaults, SDC defaults, etc. This file only overrides what's
# different about the TBI011011 run:
#   * different BIDS root (/.../TrackTBI/)
#   * different results root so we don't collide with the dwi_test_smk runs
#   * single-subject subject list via a TSV (which wins over the inline list)
# =============================================================================

bids_dir:     /mnt/nfs/home/urmc-sh.rochester.edu/pndagiji/Documents/TrackTBI
results_root: /mnt/nfs/home/urmc-sh.rochester.edu/pndagiji/Documents/CIDUR_BIDS/tbi011011_smk

# Subject list comes from a dedicated TSV so the inline subjects: list in the
# base config doesn't sneak sub-001/sub-007 back in.
subjects_tsv: config/subjects.tbi011011.tsv
subjects:     []
