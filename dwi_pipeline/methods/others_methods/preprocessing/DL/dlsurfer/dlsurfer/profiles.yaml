# DLSurfer run profiles — each step references engines.yaml ids

profiles:
  core:
    phase: 1
    description: 'Default morphometry: FastSurferVINN + CC + CerebNet + HypVINN + V2C-Flow
      surfaces (FS SUBJECTS_DIR contract). No classical recon-surf. DKT by default;
      atlas-flexible — not the DKT connectome pipeline.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: fastsurfer_vinn
      stage: seg
      device: gpu
    - engine: fastsurfer_cc
      stage: seg
      device: gpu
    - engine: cerebnet
      stage: seg
      device: gpu
    - engine: hypvinn
      stage: seg
      device: gpu
    - engine: v2c_flow
      stage: csr
      device: gpu
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    citations_note: Cite Henschel 2020/2022; Faber 2022; Estrada 2023; Pollak CC 2026; Bongratz V2C-Flow 2024.
  core-lesion:
    phase: 1
    description: >
      BEST default lesion path (DL-only): standalone neuroLIT fill → FastSurfer seg
      → V2C-Flow surfaces + FS contract → optional lit-post. No classical recon-surf.
      GPU: fill+seg+V2C; CPU: install+lit-post. Upstream --lesion_mask not offered.

    requires_lesion_mask: true
    engine: hybrid
    steps:
    - engine: neurolit
      stage: fill
      device: gpu
      mode: standalone_inpaint
    - engine: fastsurfer_vinn
      stage: seg
      device: gpu
      t1: inpainted
    - engine: fastsurfer_cc
      stage: seg
      device: gpu
    - engine: cerebnet
      stage: seg
      device: gpu
    - engine: hypvinn
      stage: seg
      device: gpu
    - engine: v2c_flow
      stage: csr
      device: gpu
      t1: inpainted
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    - engine: neurolit
      stage: post
      device: cpu
      mode: lit_post
      optional_flag: post_lit
    citations_note: Cite Pollak LIT 2025 + FastSurfer + Bongratz V2C-Flow 2024.
  core-lesion-native:
    phase: 1
    description: >
      Alias of core-lesion: DL separable neuroLIT → FastSurfer seg → V2C-Flow + FS
      contract → lit-post. No classical recon-surf. Upstream --lesion_mask not offered.
    requires_lesion_mask: true
    engine: hybrid
    steps:
    - engine: neurolit
      stage: fill
      device: gpu
      mode: standalone_inpaint
    - engine: fastsurfer_vinn
      stage: seg
      device: gpu
      t1: inpainted
    - engine: fastsurfer_cc
      stage: seg
      device: gpu
    - engine: cerebnet
      stage: seg
      device: gpu
    - engine: hypvinn
      stage: seg
      device: gpu
    - engine: v2c_flow
      stage: csr
      device: gpu
      t1: inpainted
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    - engine: neurolit
      stage: post
      device: cpu
      mode: lit_post
      optional_flag: post_lit
    citations_note: Cite Pollak LIT 2025 + FastSurfer + V2C-Flow; DL separable LIT only.

  seg-quick:
    phase: 1
    description: Volume segmentation only (FastSurferVINN) — no surfaces.
    requires_lesion_mask: false
    engine: fastsurfer
    steps:
    - engine: fastsurfer_vinn
      stage: seg_only
      device: gpu
    citations_note: Cite Henschel FastSurferVINN 2022.
  seg-quick-synthseg:
    phase: 1
    description: SynthSeg volume seg (± parc) for odd contrast/resolution.
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: synthseg
      stage: seg
      device: auto
    citations_note: Cite Billot SynthSeg.
  strip:
    phase: 1
    description: SynthStrip skull-strip / brain mask utility.
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: synthstrip
      stage: strip
      device: cpu
    citations_note: Cite Hoopes SynthStrip 2022.
  fs8:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): FreeSurfer 8 recon-all. Prefer ``dlsurfer recon-all``
      (FastSurferVINN core). Use --allow-classical to run.

      '
    requires_lesion_mask: false
    engine: freesurfer8
    steps:
    - engine: freesurfer8
      stage: recon-all
      device: cpu
    citations_note: Cite FreeSurfer 8 release notes + Fischl 2012.
  fs8-lesion:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): neuroLIT fill then FS8 recon-all. Prefer ``dlsurfer recon-all-lesion``
      / profile core-lesion.

      '
    requires_lesion_mask: true
    engine: freesurfer8
    steps:
    - engine: neurolit
      stage: fill
      device: gpu
      mode: standalone_inpaint
    - engine: freesurfer8
      stage: recon-all
      device: cpu
      t1: inpainted
    - engine: neurolit
      stage: post
      device: cpu
      mode: lit_post
      optional_flag: post_lit
    citations_note: Cite Pollak LIT 2025 + FreeSurfer 8.
  register-easyreg:
    phase: 2
    description: Utility — EasyReg symmetric multimodal registration.
    requires_lesion_mask: false
    engine: utility
    steps:
    - engine: easyreg
      stage: register
      device: cpu
    citations_note: Cite Iglesias EasyReg 2023.
  register-synthmorph:
    phase: 2
    description: Utility — SynthMorph acquisition-agnostic registration.
    requires_lesion_mask: false
    engine: utility
    steps:
    - engine: synthmorph
      stage: register
      device: auto
    citations_note: Cite Hoffmann SynthMorph.
  bias-deepn4:
    phase: 2
    description: Optional DeepN4 T1 bias-field correction utility.
    requires_lesion_mask: false
    engine: utility
    steps:
    - engine: deepn4
      stage: bias
      device: auto
    citations_note: Cite Kanakaraj DeepN4 2024.
  surf-dl-topofit:
    phase: 3
    description: 'Experimental: after FastSurfer seg (or FS), replace classical white placement with TopoFit,
      then install FS surf/ contract (?h.white.topofit → ?h.white).

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: fastsurfer_vinn
      stage: seg_only
      device: gpu
    - engine: topofit
      stage: white
      device: auto
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: topofit
      mode: white
    citations_note: Cite Hoopes TopoFit 2022 + Henschel VINN.
    gate: Validate on lesioned T1 with and without LIT before enabling in production.
  surf-dl-topofit-only:
    phase: 3
    description: 'Experimental TopoFit only on an existing SUBJECTS_DIR (skip VINN), then FS surf/ contract.

      '
    experimental: true
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: hybrid
    steps:
    - engine: topofit
      stage: white
      device: auto
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: topofit
      mode: white
    citations_note: Cite Hoopes TopoFit 2022.
    gate: Validate on lesioned T1 with and without LIT before enabling in production.
  surf-dl-v2c:
    phase: 3
    description: 'Experimental: V2C-Flow WM+pial (+ template correspondence) + FS SUBJECTS_DIR surf/ contract.
      Best Ready full CSR candidate to replace recon-surf packaging.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: v2c_flow
      stage: csr
      device: gpu
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    citations_note: Cite Bongratz Vox2Cortex 2022 + V2C-Flow 2024.
    gate: TBI±LIT gate; FS contract via dlsurfer-install-surfaces.
  core-dl-surf:
    phase: 3
    description: 'DL morphometry surfaces path: FastSurfer seg_only + V2C-Flow + FS surf/ contract (no
      classical recon-surf). Use when replacing recon-surf packaging with DL CSR.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: fastsurfer_vinn
      stage: seg_only
      device: gpu
    - engine: v2c_flow
      stage: csr
      device: gpu
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    citations_note: Cite Henschel VINN + Bongratz V2C-Flow; FS tree via dlsurfer-install-surfaces.
    gate: Blocked by tbi_lit_surfaces until V2C±LIT evidence; morphometry not claimed equal to recon-surf.
  surf-dl-v2c-long:
    phase: 3
    description: 'Experimental DL longitudinal CSR (V2C-Long). Best deep-learning alternative to classical
      fs-long. Requires V2C_LONG_ROOT / pretrained; run after V2C-Flow gate evidence exists for cross-sectional
      baseline.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: v2c_long
      stage: longitudinal_csr
      device: gpu
    citations_note: Cite Bongratz V2C-Long Imaging Neurosci 2025.
    gate: TBI±LIT longitudinal gate; blocked until tbi_lit_v2c_long passes.
  sphere-sugar:
    phase: 3
    description: Experimental spherical registration via SUGAR (needs existing surfaces) + FS sphere.reg contract.
    experimental: true
    requires_lesion_mask: false
    engine: utility
    steps:
    - engine: sugar
      stage: sphere_reg
      device: auto
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: sugar
      mode: sphere
    citations_note: Cite Ren SUGAR 2023.
  thickness-fast:
    phase: 3
    description: 'Fast volumetric thickness (DL-CTE family). NOT for connectome/aparc handoff.

      '
    experimental: true
    requires_lesion_mask: false
    engine: utility
    steps:
    - engine: dl_cte
      stage: thickness
      device: auto
    citations_note: Cite Rebsamen DL+DiReCT; CortexMorph; DL-CTE.
  core-dk:
    phase: 1
    description: 'Same as core (VINN + V2C surfaces) with --fsaparc for DK volume/parc wiring.
      Equivalent to: dlsurfer run --profile core --atlas dk. Classical recon-surf not used.

      '
    requires_lesion_mask: false
    engine: hybrid
    atlas: dk
    steps:
    - engine: fastsurfer_vinn
      stage: seg
      device: gpu
    - engine: fastsurfer_cc
      stage: seg
      device: gpu
    - engine: cerebnet
      stage: seg
      device: gpu
    - engine: hypvinn
      stage: seg
      device: gpu
    - engine: v2c_flow
      stage: csr
      device: gpu
    - engine: fs_surf_contract
      stage: install_surf
      device: cpu
      backend: v2c
      mode: full
    citations_note: Cite FastSurfer + V2C-Flow; DK via --fsaparc / atlas tooling.
  core-recon-surf:
    phase: 1
    description: 'CLASSICAL surfaces fallback: FastSurfer VINN modules + recon-surf (no V2C).
      Hidden unless --allow-classical. Prefer default core (V2C) after tbi_lit_surfaces passed.

      '
    experimental: false
    is_deep_learning: false
    requires_lesion_mask: false
    engine: fastsurfer
    steps:
    - engine: fastsurfer_vinn
      stage: seg
      device: gpu
    - engine: fastsurfer_cc
      stage: seg
      device: gpu
    - engine: cerebnet
      stage: seg
      device: gpu
    - engine: hypvinn
      stage: seg
      device: gpu
    - engine: recon_surf
      stage: surf
      device: cpu
    citations_note: Cite Henschel FastSurfer recon-surf (classical).
  atlas-destrieux:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): FreeSurfer -a2009s. Prefer atlas-destrieux-dl.

      '
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: freesurfer
    atlas: destrieux
    steps:
    - engine: atlas_destrieux
      stage: parc
      device: cpu
    citations_note: Cite Destrieux 2010.
  atlas-destrieux-dl:
    phase: 3
    description: 'Best DL-path Destrieux: SUGAR spherical registration then classical -a2009s label transfer
      (no Production Destrieux U-Net yet). Experimental until SUGAR gate.

      '
    experimental: true
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: hybrid
    atlas: destrieux
    steps:
    - engine: sugar
      stage: sphere_reg
      device: auto
    - engine: atlas_destrieux
      stage: parc
      device: cpu
    citations_note: Cite Ren SUGAR 2023/2024 + Destrieux 2010.
    gate: Requires tbi_lit_sphere_sugar; Destrieux labels remain FS classifier.
  atlas-schaefer:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): Schaefer via surf2surf. Prefer atlas-schaefer-dl.

      '
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: freesurfer
    atlas: schaefer
    steps:
    - engine: atlas_schaefer
      stage: project
      device: cpu
    citations_note: Cite Schaefer 2018.
  atlas-schaefer-dl:
    phase: 3
    description: 'Best DL-path Schaefer: SUGAR then surf2surf annot projection. Experimental until SUGAR
      gate.

      '
    experimental: true
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: hybrid
    atlas: schaefer
    steps:
    - engine: sugar
      stage: sphere_reg
      device: auto
    - engine: atlas_schaefer
      stage: project
      device: cpu
    citations_note: Cite Ren SUGAR 2023/2024 + Schaefer 2018.
    gate: Requires tbi_lit_sphere_sugar.
  fs-long:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): FreeSurfer -base/-long. Prefer surf-dl-v2c-long.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: freesurfer_long
      stage: longitudinal
      device: cpu
    citations_note: Cite Reuter 2012 longitudinal FS.
  subfields-ha:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): Bayesian HA (segmentHA_T1). Prefer structure-hippunfold
      / ``dlsurfer tool hippunfold``.

      '
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: freesurfer
    steps:
    - engine: segment_ha
      stage: ha
      device: cpu
    citations_note: Cite Iglesias HA / Saygin amygdala.
  nuclei-bs-thal:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL (hidden by default): Bayesian BS+thal. Prefer structure-brainstem-mars / nuclei-thalamic-dti-cnn.

      '
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: freesurfer
    steps:
    - engine: segment_bs
      stage: brainstem
      device: cpu
    - engine: segment_thalamic
      stage: thalamic
      device: cpu
    citations_note: Cite Iglesias brainstem 2015 + thalamic 2018.
  structure-brainstem-mars:
    phase: 2
    description: 'Best Ready DL brainstem (MARS nnU-Net). Writes under SUBJECTS_DIR/mri/brainstem_mars.
      Set MARS_SIF or MARS_ROOT. Classical fallback: nuclei-bs-thal / segmentBS.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: mars_brainstem
      stage: brainstem
      device: auto
    citations_note: Cite Gesierich Hum Brain Mapp 2025; nnU-Net Isensee.
  nuclei-thalamic-dti-cnn:
    phase: 2
    description: 'Best Ready DL thalamic nuclei (FS T1+FA+V1 CNN). Requires FA/V1 (+ aseg) env paths or
      --notes placeholders. Classical T1-only: segmentThalamicNuclei.

      '
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: freesurfer
    steps:
    - engine: thalamic_dti_cnn
      stage: thalamic
      device: auto
    citations_note: Cite FreeSurfer ThalamicNucleiDTI CNN wiki.
  structure-sclimbic:
    phase: 2
    description: 'ScLimbic DL limbic subunits (mri_sclimbic_seg). XOR with HypVINN for hypothalamus overlap;
      use when BF/fornix/MB/NAc needed.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: sclimbic
      stage: limbic
      device: cpu
    citations_note: Cite Greve NeuroImage 2021 ScLimbic.
  seg-wmh-synthseg:
    phase: 2
    description: 'WMH-SynthSeg (anatomy + WMH label 77) for clinical/low-field/lesioned T1. Prefer over
      seg-quick-synthseg when WMH volumes matter.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: wmh_synthseg
      stage: seg
      device: auto
    citations_note: Cite Laso et al. WMH-SynthSeg arXiv:2312.05119.
  infant-ibeat:
    phase: 2
    description: 'Best Ready DL infant CSR (iBEAT V2.0, birth–6y). XOR with adult core — set IBEAT_SIF
      / IBEAT_AGE_MONTHS. Not adult TBI default.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: infant_ibeat
      stage: infant_csr
      device: gpu
    citations_note: Cite Wang Nat Protoc 2023 iBEAT V2.0.
  fs-clinical:
    phase: 2
    description: 'Hybrid DL clinical stream: recon-all-clinical (SynthSeg/SynthSR/SynthDist). For true
      infants prefer infant-ibeat.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: recon_all_clinical
      stage: clinical
      device: auto
    citations_note: Cite SynthSeg / SynthDist / recon-all-clinical docs.
  preprocess-synthsr:
    phase: 2
    description: 'Optional T1 preprocess only (mri_synthsr). Writes synthsr T1 under SUBJECTS_DIR; does
      not segment PC or claustrum. Chain into core / structure-* afterward.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: synthsr
      stage: preprocess
      device: auto
    citations_note: Cite Billot SynthSR; FreeSurfer mri_synthsr.
  structure-claustrum:
    phase: 2
    description: 'Mauri 2025 claustrum (mri_claustrum_seg). Raw T1 → out under SUBJECTS_DIR/mri/claustrum.
      Lab: Documents/clau_seg. Not a piriform model.

      '
    requires_lesion_mask: false
    engine: freesurfer
    steps:
    - engine: mauri_claustrum
      stage: claustrum
      device: cpu
    citations_note: Cite Mauri Hum Brain Mapp 2025;46:e70303.
  structure-piriform-synthseg:
    phase: 3
    description: 'Experimental SynthSeg-PC (Billot GMM U-Net) for Steinbart 125/126. Requires SYNTHSEG_PC_MODEL
      / SYNTHSEG_PC_ROOT / label npy. IDEAS production PC stays JLF until eval gate. Not mri_synthseg;
      not Mauri claustrum weights.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: synthseg_pc
      stage: piriform
      device: auto
    citations_note: Cite Billot SynthSeg 2023; Steinbart 2023; Hammers 2003.
    gate: Hammers Dice/Jaccard vs JLF/MAPER; do not deploy as IDEAS production before gate.
  structure-hippunfold:
    phase: 2
    description: 'Preferred Ready DL HA (HippUnfold). Classical Bayesian fallback is subfields-ha (segmentHA_T1).

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: hippunfold
      stage: hippo
      device: auto
    citations_note: Cite DeKraker eLife 2022.
  structure-hippodeep:
    phase: 2
    description: 'Fast Ready DL hippocampus mask (Hippodeep). Prefer structure-hippunfold for unfold morphometry;
      subfields-ha for Bayesian nuclei.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: hippodeep
      stage: hippo_mask
      device: auto
    citations_note: Cite Thyreau Hippodeep.
  seg-wmh-mars:
    phase: 2
    description: 'MARS-WMH nnU-Net (FLAIR+T1). Set MARS_WMH_SIF + MARS_FLAIR. Prefer seg-wmh-synthseg
      for T1-only clinical WMH.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: mars_wmh
      stage: wmh
      device: auto
    citations_note: Cite Gesierich MARS-WMH; nnU-Net.
  nuclei-thalamic-deep-thomas:
    phase: 2
    description: 'Experimental T1-only Deep-THOMAS thalamic nnU-Net. Prefer nuclei-thalamic-dti-cnn when
      FA/V1 exist. Set DEEP_THOMAS_SIF when weights public.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: deep_thomas
      stage: thalamic
      device: auto
    citations_note: Cite Deep-THOMAS ISMRM 2025 (weights pending).
  sphere-s3reg:
    phase: 3
    description: 'S3Reg spherical registration backup (Zhao TMI 2021). Prefer sphere-sugar as literature-first
      Phase-3 choice.

      '
    experimental: true
    requires_lesion_mask: false
    requires_existing_subject: true
    engine: hybrid
    steps:
    - engine: s3reg
      stage: sphere
      device: auto
    citations_note: Cite Zhao S3Reg TMI 2021.
  strip-hdbet:
    phase: 2
    description: 'HD-BET skull-strip util. Prefer strip (SynthStrip) for FS one-license path.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: hdbet
      stage: strip
      device: auto
    citations_note: Cite Isensee HD-BET.
  lesion-vbg:
    phase: 2
    description: 'Experimental VBG lesion fill (Radwan). TBI caution Deutscher 2025 — prefer core-lesion
      (neuroLIT). Requires --lesion-mask.

      '
    experimental: true
    requires_lesion_mask: true
    engine: hybrid
    steps:
    - engine: vbg
      stage: fill
      device: auto
    citations_note: Cite Radwan VBG 2021; Deutscher 2025 caution.
  lesion-enantiomorphic:
    phase: 2
    is_deep_learning: false
    description: 'CLASSICAL / non-DL (hidden by default): unilateral enantiomorphic fill. Prefer core-lesion
      (neuroLIT).

      '
    requires_lesion_mask: true
    engine: hybrid
    steps:
    - engine: enantiomorphic
      stage: fill
      device: cpu
    citations_note: Cite Nachev; Fekonja 2022.
  structure-ventricles-mars:
    phase: 2
    description: 'MARS lateral-ventricle nnU-Net. Set MARS_VENT_SIF.

      '
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: mars_ventricles
      stage: ventricles
      device: auto
    citations_note: Cite miac-research/MARS-ventricles.
  structure-claustrum-albishri:
    phase: 2
    description: 'Experimental Albishri claustrum CNN (runner-up). Prefer structure-claustrum (Mauri).

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: albishri_claustrum
      stage: claustrum
      device: auto
    citations_note: See Mauri HBM 2025 baselines.
  structure-piriform-nnunet:
    phase: 3
    description: 'Experimental nnU-Net piriform (PC 125/126). IDEAS production stays JLF until gate; prefer
      structure-piriform-synthseg for SynthSeg-PC eval.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: nnunet_piriform
      stage: piriform
      device: auto
    citations_note: Cite Steinbart 2023; nnU-Net Isensee.
  structure-amygdala-go:
    phase: 2
    description: 'Experimental whole-amygdala DL mask (not nuclei). Prefer subfields-ha for nuclei.

      '
    experimental: true
    requires_lesion_mask: false
    engine: hybrid
    steps:
    - engine: amygdala_go
      stage: amygdala
      device: auto
    citations_note: AmygdalaGo-style whole-amygdala CNNs.
  infant-dhcp:
    phase: 2
    description: 'Experimental dHCP neonatal T2w CSR (Qiang). Prefer infant-ibeat for birth–6y T1/T2.
      Set DHCP_SIF / DHCP_T2.

      '
