  preprocess-synthsr:
    category: utility
    kind: volume
    preferred: [mri/T1.synthsr.nii.gz]
    required: [mri]
  register-easyreg:
    category: utility
    kind: volume
    required: [mri]
  register-synthmorph:
    category: utility
    kind: volume
    preferred: [mri/synthmorph]
    required: [mri]
  fs8:
    category: morphometry
    kind: full
    preferred: [mri, surf, scripts, stats]
  fs8-lesion:
    category: morphometry
    kind: full
    preferred: [mri, surf, scripts]
  fs-clinical:
