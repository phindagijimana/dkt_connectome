# FreeSurfer-shaped SUBJECTS_DIR contract for all DLSurfer outputs.
# SSOT: plan destinations + post-run checks. Never invent empty classical files.
#
# Layout under $SD/$SID/:
#   mri/ surf/ label/ stats/ scripts/ tmp/ touch/   # classical-compatible
#   dwi/ pet/ fmri/ qc/                             # modality siblings (FS-suite)
#   hippunfold/ ibeat/ dhcp/                        # third-party app trees (documented)
#   surf/dlsurfer/<backend>/                        # non-promoted DL meshes
#   mri/<tool>/                                     # DL structure extensions

layout:
  dirs:
    - mri
    - surf
    - label
    - stats
    - scripts
    - tmp
    - touch
  modality_dirs:
    - dwi
    - pet
    - fmri
    - qc
  app_dirs:
    - hippunfold
    - ibeat
    - dhcp
  policy: >
    Classical-compatible products use FreeSurfer names under mri/surf/label/stats.
    DL extensions live under mri/<tool>/ or surf/dlsurfer/<backend>/ until promoted
    by fs_surf_contract. Multimodal outputs use sibling modality dirs (not stuffed into mri/).
    Markers: scripts/dlsurfer_<engine>.done and scripts/dlsurfer_surf_dl.done —
    do not treat soft recon-surf.done from DL install as classical recon-surf.

# Profile → contract (paths relative to $SD/$SID)
profiles:
  # --- morphometry core ---
  core:
    category: morphometry
    kind: full
    preferred:
      - mri/aparc.DKTatlas+aseg.deep.mgz
      - mri/aseg.auto_noCCseg.mgz
      - surf/lh.white
      - surf/rh.white
      - surf/lh.pial
      - surf/rh.pial
      - stats
  core-lesion:
    category: morphometry
    kind: full
    preferred:
      - mri/aparc.DKTatlas+aseg.deep.mgz
      - mri/inpainted.lit.nii.gz
      - surf/lh.white
      - surf/rh.white
      - stats
  core-lesion-native:
    category: morphometry
    kind: full
    preferred:
      - mri/aparc.DKTatlas+aseg.deep.mgz
      - mri/inpainted.lit.nii.gz
      - surf/lh.white
      - surf/rh.white
      - stats
  core-dk:
    category: morphometry
    kind: full
    atlas: dk
    preferred:
      - mri/aseg.mgz
      - label/lh.aparc.annot
      - label/rh.aparc.annot
      - surf/lh.white
      - surf/rh.white
  core-dl-surf:
    category: surfaces_dl
    kind: seg_plus_surf_dl
    required:
      - mri
      - surf/lh.white
      - surf/rh.white
      - surf/lh.pial
      - surf/rh.pial
      - scripts/dlsurfer_surf_dl.done
  core-recon-surf:
    category: morphometry
    kind: full
    preferred:
      - mri/aparc.DKTatlas+aseg.deep.mgz
      - surf/lh.white
      - surf/rh.white
      - surf/lh.pial
      - surf/rh.pial
      - stats
  seg-quick:
    category: morphometry
    kind: seg_only
    required: [mri, scripts]
  seg-quick-synthseg:
    category: morphometry
    kind: seg_only
    required: [mri]
  seg-synthseg-robust:
    category: morphometry
    kind: volume
    required: [mri/synthseg_robust]
  seg-super-synth:
    category: morphometry
    kind: volume
    required: [mri/super_synth]
  strip:
    category: utility
