# dkt_connectome — conda/mamba environment for the Snakemake orchestrator
#
# Create with:
#     mamba env create -f environment.yml
#     conda activate dkt_connectome
#
# Step tools (QSIPrep, QSIRecon, FreeSurfer, MRtrix3, ANTs) run inside
# Apptainer images — see README.md / ./dkt install.
name: dkt_connectome
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - pip
  - pip:
      - snakemake>=8.0
      - snakemake-executor-plugin-slurm>=0.6
