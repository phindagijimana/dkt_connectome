# =============================================================================
# WorkflowHub registration metadata for tracktbi_connectome
# =============================================================================
# Canonical pipeline: dwi_pipeline/run (BIDS App) + dwi_pipeline/workflow/
# Legacy 4-stage root workflow: Snakefile (deprecated)
# =============================================================================

name: tracktbi_connectome
description: |
  Canonical TrackTBI / CIDUR BIDS App pipeline (v0.2+). QSIPrep → optional
  neuroLIT inpainting → FreeSurfer/FastSurfer → QSIRecon ACT-HSVS → DKT
  connectome → optional disconnectome → node-strength / ENIGMA report.

version: "0.2.0"
license: Apache-2.0
homepage: https://github.com/phindagijimana/dkt_connectome
repository: https://github.com/phindagijimana/dkt_connectome.git
issue_tracker: https://github.com/phindagijimana/dkt_connectome/issues

main_workflow_file: dwi_pipeline/workflow/Snakefile
workflow_language: Snakemake

legacy_workflow_file: Snakefile
legacy_workflow_note: "Root 4-stage dk_connectome — retained for backward compatibility only."

categories:
  - Connectomics
  - Diffusion MRI
  - BIDS Apps

tags:
  - DWI
  - tractography
  - QSIPrep
  - QSIRecon
  - FreeSurfer
  - FastSurfer
  - MRtrix3
  - structural-connectome
  - Desikan-Killiany-Tourville
  - disconnectome
  - TBI
  - reproducibility
  - Apptainer
  - Snakemake
  - BIDS

authors:
  - name: Phind Ndagijimana
    affiliation: University of Rochester Medical Center
    orcid: ""

containers:
  - name: qsiprep
    source: docker://pennlinc/qsiprep:1.0.0
  - name: qsirecon
    source: docker://pennlinc/qsirecon:1.2.1
  - name: freesurfer
    source: docker://freesurfer/freesurfer:7.4.1
  - name: dk_connectome
    source: docker://ghcr.io/phindagijimana/dk-connectome:0.1.0
    description: |
      Step 4 connectome image (MRtrix3 + ANTs). Build recipe in
      containers/Dockerfile.dk_connectome. HPC uses Apptainer .sif instead.

executors:
  - local
  - slurm
  - docker
  - kubernetes

provenance:
  ro_crate_path: ro-crate-metadata.json

cite_as: CITATION.cff
