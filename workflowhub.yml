# =============================================================================
# WorkflowHub registration metadata for dkt_connectome
# =============================================================================
# Canonical pipeline: dwi_pipeline/run (BIDS App) + dwi_pipeline/workflow/
# Legacy 4-stage root workflow: Snakefile (deprecated)
# =============================================================================

name: dkt_connectome
description: |
  Lesion-aware structural connectomics BIDS App (v0.2+). QSIPrep → optional
  neuroLIT inpainting → FreeSurfer/FastSurfer → QSIRecon ACT-HSVS → DKT
  connectome → optional disconnectome → node-strength / ENIGMA report.
  Validated on TRACK-TBI (~14 centers) and URMC clinical MRI cohorts.

version: "0.2.1"
license: Apache-2.0
homepage: https://github.com/phindagijimana/dkt_connectome
repository: https://github.com/phindagijimana/dkt_connectome.git
issue_tracker: https://github.com/phindagijimana/dkt_connectome/issues

main_workflow_file: dwi_pipeline/workflow/Snakefile
workflow_language: Snakemake

legacy_workflow_file: Snakefile
legacy_workflow_note: "Root 4-stage dk_connectome — retained for backward compatibility only."

categories:
  - Connectomics
  - Diffusion MRI
  - BIDS Apps

tags:
  - DWI
  - tractography
  - QSIPrep
  - QSIRecon
  - FreeSurfer
  - FastSurfer
  - MRtrix3
  - structural-connectome
  - Desikan-Killiany-Tourville
  - disconnectome
  - TBI
  - reproducibility
  - Apptainer
  - Snakemake
  - BIDS

authors:
  - name: Philbert Ndagijimana
    affiliation: University of Rochester Medical Center
    orcid: ""

containers:
  - name: qsiprep
    source: docker://pennlinc/qsiprep:1.0.0
  - name: qsirecon
    source: docker://pennlinc/qsirecon:1.2.1
  - name: freesurfer
    source: docker://freesurfer/freesurfer:7.4.1
  - name: dkt_connectome_orchestrator
    source: docker://phindagijimana321/dkt-connectome:0.2.1
    description: BIDS App orchestrator (Snakemake); step images mount at runtime.
  - name: connectome
    source: docker://ghcr.io/phindagijimana/dk-connectome:0.2.0
    description: |
      Step 4 connectome image (FreeSurfer tools + ANTs + MRtrix3).
      Build: dwi_pipeline/containers/connectome/ or CI build-dk-connectome.yml.

executors:
  - local
  - slurm
  - docker
  - kubernetes

provenance:
  ro_crate_path: ro-crate-metadata.json

cite_as: CITATION.cff
