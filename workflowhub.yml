# WorkflowHub metadata — canonical Snakemake pipeline only.

name: dkt_connectome
description: |
  Lesion-aware structural connectomics BIDS App (v0.3.0). QSIPrep → optional
  neuroLIT inpainting → FreeSurfer/FastSurfer → QSIRecon ACT-HSVS → DKT
  connectome → optional disconnectome → node-strength / ENIGMA report.
  Public software demos: IDEAS II (OpenNeuro ds007401) and BTC glioma PAT20
  (OpenNeuro ds001226, lesion-aware path).

version: "0.3.0"
license: Apache-2.0
homepage: https://github.com/phindagijimana/dkt_connectome
repository: https://github.com/phindagijimana/dkt_connectome.git
issue_tracker: https://github.com/phindagijimana/dkt_connectome/issues

main_workflow_file: dwi_pipeline/workflow/Snakefile
workflow_language: Snakemake

categories:
  - Connectomics
  - Diffusion MRI
  - BIDS Apps

tags:
  - DWI
  - tractography
  - QSIPrep
  - QSIRecon
  - FreeSurfer
  - FastSurfer
  - MRtrix3
  - structural-connectome
  - Desikan-Killiany-Tourville
  - disconnectome
  - reproducibility
  - Apptainer
  - Snakemake
  - BIDS

authors:
  - name: Philbert Ndagijimana
    affiliation: University of Rochester Medical Center
    orcid: ""

containers:
  - name: qsiprep
    source: docker://pennlinc/qsiprep:1.0.0
  - name: qsirecon
    source: docker://pennlinc/qsirecon:1.2.1
  - name: freesurfer
    source: docker://freesurfer/freesurfer:7.4.1
  - name: dkt_connectome_orchestrator
    source: docker://phindagijimana321/dkt-connectome:0.3.0
    description: BIDS App orchestrator (Snakemake); step images mount at runtime.
  - name: connectome
    source: docker://ghcr.io/phindagijimana/dk-connectome:0.3.0
    description: Step 4 connectome image (FreeSurfer tools + ANTs + MRtrix3).

executors:
  - local
  - slurm
  - docker

provenance:
