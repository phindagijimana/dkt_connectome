name: Connectome and VBT publish

on:
  push:
    branches: [main]
    paths:
      - 'dwi_pipeline/containers/connectome/**'
      - 'dwi_pipeline/containers/vbt/**'
      - 'dwi_pipeline/scripts/run_disconnectome.py'
      - 'dwi_pipeline/scripts/run_vbt.py'
      - 'dwi_pipeline/scripts/ci_stage_connectome_build_context.sh'
      - 'dwi_pipeline/scripts/ci_stage_vbt_build_context.sh'
      - 'dwi_pipeline/release_manifest.json'
      - '.github/workflows/connectome_vbt_publish.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (e.g. 0.3.0)
        type: string
        default: "0.3.0"
      push_dockerhub:
        description: Also push to Docker Hub (requires DOCKERHUB_* secrets)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || '0.3.0' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dk-connectome
            stage_script: ci_stage_connectome_build_context.sh
            context: dwi_pipeline/containers/connectome/build_ctx_lean
            dockerfile: dwi_pipeline/containers/connectome/Dockerfile
            dockerhub_repo: dkt_connectome
            smoke: run --help
          - name: dkt-vbt
            stage_script: ci_stage_vbt_build_context.sh
            context: dwi_pipeline/containers/vbt/build_ctx
            dockerfile: dwi_pipeline/containers/vbt/Dockerfile
            dockerhub_repo: dkt-vbt
            smoke: --help
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dh_creds
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dh_creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Stage build context
        run: bash "dwi_pipeline/scripts/${{ matrix.stage_script }}"

      - name: Compose tags
        id: tags
        run: |
          ghcr="ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}"
          tags="${ghcr}"
          want_dh=false
          if [[ "${{ steps.dh_creds.outputs.present }}" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_dockerhub }}" == "true" ]]; then
              want_dh=true
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              want_dh=true
            fi
          fi
          if [[ "${want_dh}" == "true" ]]; then
            tags="${tags},phindagijimana321/${{ matrix.dockerhub_repo }}:${{ env.IMAGE_TAG }}"
          fi
          echo "list=${tags}" >> "$GITHUB_OUTPUT"
          echo "ghcr=${ghcr}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Smoke test
        run: |
          docker run --rm "${{ steps.tags.outputs.ghcr }}" ${{ matrix.smoke }} | head -5

      - name: Summary
        run: echo "- \`${{ steps.tags.outputs.ghcr }}\`" >> "$GITHUB_STEP_SUMMARY"
