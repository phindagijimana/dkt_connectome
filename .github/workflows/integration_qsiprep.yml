name: Integration (QSIPrep real container)

# Pull QSIPrep + version smoke (no license). Optional full ./run only if repo secret FS_LICENSE is set.
# FreeSurfer licenses are per-user — see installation.md (not a maintainer/repo requirement).

on:
  workflow_dispatch:
    inputs:
      skip_pipeline_run:
        description: Pull + version smoke only (skip ./run)
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 0"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  qsiprep-real:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Optional FreeSurfer license (repo secret)
        id: fslic
        env:
          FS_LICENSE_SECRET: ${{ secrets.FS_LICENSE }}
        run: |
          if [[ -n "${FS_LICENSE_SECRET}" ]]; then
            printf '%s' "${FS_LICENSE_SECRET}" > /tmp/license.txt
            test -s /tmp/license.txt
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No FS_LICENSE Actions secret — running pull + version smoke only."
            echo "::notice::Each user obtains their own license: https://surfer.nmr.mgh.harvard.edu/registration.html"
          fi

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q -O /tmp/apptainer.deb \
            https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb
          sudo dpkg -i /tmp/apptainer.deb || sudo apt-get install -f -y
          apptainer --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "snakemake>=8.0,<10" pyyaml numpy scipy nibabel

      - name: Regenerate minimal BIDS fixture
        run: python3 dwi_pipeline/tests/fixtures/generate_bids_fixture.py

      - name: Pull QSIPrep container
        working-directory: dwi_pipeline
        env:
          DKT_CONTAINER_CACHE: ${{ runner.temp }}/dkt_containers
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer_tmp
        run: |
          mkdir -p "${APPTAINER_TMPDIR}"
          python3 scripts/container_install.py pull \
            --cache "${DKT_CONTAINER_CACHE}" \
            --mode qsiprep \
            --write-config \
            --quiet
          python3 scripts/container_install.py list --cache "${DKT_CONTAINER_CACHE}" --mode qsiprep

      - name: QSIPrep container version smoke
        working-directory: dwi_pipeline
        env:
          DKT_CONTAINER_CACHE: ${{ runner.temp }}/dkt_containers
        run: |
          QSIF="$(python3 -c "
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path('workflow/config/config.local.yaml').read_text())
          print(cfg['containers']['qsiprep'])
          ")"
          apptainer exec "${QSIF}" qsiprep --version

      - name: Real QSIPrep run (bids_minimal)
        if: >-
          steps.fslic.outputs.present == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_pipeline_run != true)
        working-directory: dwi_pipeline
        env:
          FS_LICENSE: /tmp/license.txt
          DKT_CONTAINER_CACHE: ${{ runner.temp }}/dkt_containers
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer_tmp
          TEMPLATEFLOW_HOME: ${{ runner.temp }}/templateflow
          RESULTS_ROOT: ${{ runner.temp }}/integration_out
        run: |
          mkdir -p "${TEMPLATEFLOW_HOME}" "${RESULTS_ROOT}"
          ./run tests/fixtures/bids_minimal "${RESULTS_ROOT}" participant \
            --participant-label EXAMPLE \
            --session-filter baseline \
            --mode qsiprep \
            --no-sdc \
            --no-dwi-filter \
            --n-cpus 2 \
            --random-seed 42

      - name: Verify QSIPrep outputs
        if: >-
          steps.fslic.outputs.present == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.skip_pipeline_run != true)
        run: |
          bash dwi_pipeline/scripts/integration_verify_qsiprep.sh \
            "${{ runner.temp }}/integration_out" EXAMPLE

      - name: Summary
        if: always()
        run: |
          {
            echo "## QSIPrep integration"
            echo "- Pull + \`qsiprep --version\`: always run"
            echo "- Full \`./run\`: only when optional \`FS_LICENSE\` Actions secret is set"
            echo "- Users: register for your own license — [installation.md](https://dkt-connectome.readthedocs.io/en/latest/installation/)"
          } >> "$GITHUB_STEP_SUMMARY"
