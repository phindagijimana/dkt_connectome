name: Integration (IDEAS golden)

# OpenNeuro ds007401 — dry-run by default (no FreeSurfer license needed).
# Real QSIPrep requires optional FS_LICENSE repo secret OR run locally with your own license.

on:
  workflow_dispatch:
    inputs:
      analysis:
        description: dry-run | qsiprep-only
        type: choice
        options:
          - dry-run
          - qsiprep-only
        default: dry-run
      subject:
        description: Participant label (without sub-)
        type: string
        default: "1"
      session:
        description: Session (without ses- prefix)
        type: string
        default: "1"
  schedule:
    - cron: "0 9 1 * *"

permissions:
  contents: read

jobs:
  ideas-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: License mode (dry-run stub vs optional secret)
        id: fslic
        env:
          FS_LICENSE_SECRET: ${{ secrets.FS_LICENSE }}
          ANALYSIS: ${{ github.event.inputs.analysis || 'dry-run' }}
        run: |
          if [[ "${ANALYSIS}" == "qsiprep-only" ]]; then
            if [[ -z "${FS_LICENSE_SECRET}" ]]; then
              echo "::error::Real QSIPrep needs FS_LICENSE Actions secret, or run locally with your own license."
              exit 1
            fi
            printf '%s' "${FS_LICENSE_SECRET}" > /tmp/license.txt
            echo "bids_app_ci=0" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            touch /tmp/license.txt
            echo "bids_app_ci=1" >> "$GITHUB_OUTPUT"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apptainer + AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget awscli
          wget -q -O /tmp/apptainer.deb \
            https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb
          sudo dpkg -i /tmp/apptainer.deb || sudo apt-get install -f -y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "snakemake>=8.0,<10" pyyaml numpy scipy nibabel

      - name: Download IDEAS sample (OpenNeuro ds007401)
        working-directory: dwi_pipeline
        run: bash scripts/download_ideas_sample.sh

      - name: Pull containers
        working-directory: dwi_pipeline
        env:
          DKT_CONTAINER_CACHE: ${{ runner.temp }}/dkt_containers
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer_tmp
        run: |
          mkdir -p "${APPTAINER_TMPDIR}"
          python3 scripts/container_install.py pull \
            --cache "${DKT_CONTAINER_CACHE}" \
            --mode qsiprep \
            --write-config \
            --quiet

      - name: Run pipeline on IDEAS subject
        working-directory: dwi_pipeline
        env:
          FS_LICENSE: /tmp/license.txt
          BIDS_APP_CI: ${{ steps.fslic.outputs.bids_app_ci }}
          DKT_CONTAINER_CACHE: ${{ runner.temp }}/dkt_containers
          TEMPLATEFLOW_HOME: ${{ runner.temp }}/templateflow
          RESULTS_ROOT: ${{ runner.temp }}/ideas_out
          BIDS_DIR: ${{ github.workspace }}/dwi_pipeline/sample_data/ideas/bids
          ANALYSIS: ${{ github.event.inputs.analysis || 'dry-run' }}
          SUBJECT: ${{ github.event.inputs.subject || '1' }}
          SESSION: ${{ github.event.inputs.session || '1' }}
        run: |
          mkdir -p "${TEMPLATEFLOW_HOME}" "${RESULTS_ROOT}"
          EXTRA=()
          if [[ "${ANALYSIS}" == "dry-run" ]]; then
            EXTRA+=(--dry-run)
          fi
          ./run "${BIDS_DIR}" "${RESULTS_ROOT}" participant \
            --participant-label "${SUBJECT}" \
            --session-filter "${SESSION}" \
            --mode qsiprep \
            --fastsurfer \
            --syn \
            --dwi-select config/dwi_select_ideas_b2500.json \
            --n-cpus 4 \
            "${EXTRA[@]}"

      - name: Verify (qsiprep-only runs)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.analysis == 'qsiprep-only'
        run: |
          bash dwi_pipeline/scripts/integration_verify_qsiprep.sh \
            "${{ runner.temp }}/ideas_out" "${{ github.event.inputs.subject || '1' }}"
