name: Docker publish

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'dwi_pipeline/Dockerfile'
      - 'dwi_pipeline/docker-entrypoint.sh'
      - 'dwi_pipeline/run'
      - 'dwi_pipeline/scripts/**'
      - '.github/workflows/docker_publish.yml'
  workflow_dispatch:
    inputs:
      push:
        description: Also push to Docker Hub (requires DOCKERHUB_* secrets)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase GHCR image
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dkt-connectome" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: creds
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GHCR push always runs; set DOCKERHUB_* secrets to mirror to Docker Hub in CI"
          fi

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "version=0.2.0" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.2.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Should push to Docker Hub
        id: push_dh
        run: |
          want_push=false
          if [[ "${{ steps.creds.outputs.present }}" == "true" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              want_push=true
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
              want_push=true
            fi
          fi
          echo "enabled=${want_push}" >> "$GITHUB_OUTPUT"

      - name: Compose image tags
        id: tags
        run: |
          {
            echo "${{ steps.ghcr.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.ghcr.outputs.image }}:latest"
            if [[ "${{ steps.push_dh.outputs.enabled }}" == "true" ]]; then
              echo "phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }}"
              echo "phindagijimana321/dkt-connectome:latest"
            fi
          } > /tmp/image-tags.txt
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/image-tags.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build orchestrator image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dwi_pipeline/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          load: true

      - name: Docker smoke test
        run: |
          IMG="${{ steps.ghcr.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker pull "${IMG}"
          docker run --rm "${IMG}" --version
          mkdir -p /tmp/docker_out
          touch /tmp/license.txt
          docker run --rm \
            -v "${{ github.workspace }}/dwi_pipeline/tests/fixtures/bids_minimal:/data/bids:ro" \
            -v /tmp/docker_out:/out \
            -e BIDS_APP_CI=1 \
            -e FS_LICENSE=/tmp/license.txt \
            "${IMG}" \
            /data/bids /out participant \
            --participant-label EXAMPLE --session-filter ses-1 \
            --dry-run --no-sdc --no-dwi-filter --mode qsiprep
          docker run --rm \
            -e BIDS_APP_CI=1 \
            -e FS_LICENSE=/tmp/license.txt \
            "${IMG}" doctor

      - name: Summary
        run: |
          {
            echo "## Orchestrator image"
            echo "- GHCR: \`${{ steps.ghcr.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo "- Docker Hub (CI): \`phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }}\` when \`DOCKERHUB_*\` secrets are set"
            echo "- Local mirror: \`bash dwi_pipeline/scripts/mirror_ghcr_to_dockerhub.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
