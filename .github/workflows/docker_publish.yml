name: Docker publish

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'dwi_pipeline/Dockerfile'
      - 'dwi_pipeline/docker-entrypoint.sh'
      - 'dwi_pipeline/run'
      - 'dwi_pipeline/scripts/**'
      - '.github/workflows/docker_publish.yml'
  workflow_dispatch:
    inputs:
      push:
        description: Push to Docker Hub (requires DOCKERHUB_* secrets)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: creds
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — image will build locally only"
          fi

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "version=0.2.0" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.2.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Should push to Docker Hub
        id: push
        run: |
          want_push=false
          if [[ "${{ steps.creds.outputs.present }}" == "true" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              want_push=true
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
              want_push=true
            fi
          fi
          echo "enabled=${want_push}" >> "$GITHUB_OUTPUT"

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dwi_pipeline/Dockerfile
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: |
            phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }}
            phindagijimana321/dkt-connectome:latest
          load: true

      - name: Docker smoke test
        run: |
          docker run --rm phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }} --version
          mkdir -p /tmp/docker_out
          touch /tmp/license.txt
          docker run --rm \
            -v "${{ github.workspace }}/dwi_pipeline/tests/fixtures/bids_minimal:/data/bids:ro" \
            -v /tmp/docker_out:/out \
            -e BIDS_APP_CI=1 \
            -e FS_LICENSE=/tmp/license.txt \
            phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }} \
            /data/bids /out participant \
            --participant-label EXAMPLE --session-filter ses-1 \
            --dry-run --no-sdc --no-dwi-filter --mode qsiprep
          docker run --rm \
            -e BIDS_APP_CI=1 \
            -e FS_LICENSE=/tmp/license.txt \
            phindagijimana321/dkt-connectome:${{ steps.meta.outputs.version }} doctor
