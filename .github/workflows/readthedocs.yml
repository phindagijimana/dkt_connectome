name: Read the Docs

# RTD is not receiving GitHub webhooks for this repo (0 hooks configured).
# This workflow triggers a Read the Docs rebuild on every docs-related push.
#
# Setup (one-time):
#   1. https://readthedocs.org/accounts/tokens/ → create token
#   2. GitHub repo → Settings → Secrets → READTHEDOCS_TOKEN

on:
  push:
    branches: [main]
    paths:
      - 'dwi_pipeline/docs/**'
      - 'dwi_pipeline/mkdocs.yml'
      - 'dwi_pipeline/overrides/**'
      - '.readthedocs.yaml'
      - '.github/workflows/readthedocs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trigger-rtd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Read the Docs build (latest)
        id: rtd_trigger
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          if [[ -z "${READTHEDOCS_TOKEN}" ]]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "::error::READTHEDOCS_TOKEN not set — Read the Docs will NOT rebuild automatically."
            echo "Fix: https://readthedocs.org/accounts/tokens/ → GitHub repo secret READTHEDOCS_TOKEN"
            echo "Or: RTD dashboard → dkt-connectome → Builds → Build version (latest)"
            echo "See dwi_pipeline/docs/maintainer/maintainer_tasks.md §14"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              exit 1
            fi
            exit 0
          fi
          echo "triggered=true" >> "$GITHUB_OUTPUT"
          for version in latest stable; do
            echo "Triggering RTD build for version: ${version}"
            curl -fsS -X POST \
              -H "Authorization: token ${READTHEDOCS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://app.readthedocs.org/api/v3/projects/dkt-connectome/versions/${version}/builds/" \
              -d '{}'
          done

      - name: Verify mkdocs title (local sanity check)
        run: |
          pip install -r dwi_pipeline/docs/requirements.txt
          mkdocs build --strict --config-file dwi_pipeline/mkdocs.yml
          grep -q 'DKT Connectome' dwi_pipeline/site/index.html
          ! grep -qi 'TrackTBI Connectome' dwi_pipeline/site/index.html
          grep -qE 'favicon\.(png|ico)|assets/images/favicon' dwi_pipeline/site/index.html
          test -f dwi_pipeline/site/img/pipeline_overview.svg

      - name: Verify live Read the Docs (science pages)
        if: steps.rtd_trigger.outputs.triggered == 'true'
        run: |
          sleep 90
          bash dwi_pipeline/scripts/verify_rtd_live.sh
