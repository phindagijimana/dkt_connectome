# =============================================================================
# Build and publish the dk-connectome image to GitHub Container Registry.
#
# Triggers
#   - manual: workflow_dispatch (any branch)
#   - any push to main (publishes :main + :sha-XXXX tags so dev users can pull)
#   - any tag matching v* (publishes :<tag> + :latest)
#
# The image goes to ghcr.io/<owner>/dk-connectome (in lower case). After the
# first successful push, make the package public from
#   https://github.com/users/<owner>/packages/container/dk-connectome/settings
# so users do not need a token to apptainer pull it.
# =============================================================================
name: build-dk-connectome

on:
  push:
    branches: [ main ]
    paths:
      - 'containers/Dockerfile.dk_connectome'
      - 'containers/Apptainer.dk_connectome.def'
      - '.github/workflows/build-dk-connectome.yml'
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dk-connectome

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lower
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}
          # On tags v1.2.3 -> {1.2.3, 1.2, latest}
          # On main push  -> {main, sha-<short>}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile.dk_connectome
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
