name: ACT containers publish

on:
  push:
    branches: [main]
    paths:
      - 'dwi_pipeline/containers/lesion_act/**'
      - 'dwi_pipeline/containers/deep_atropos/**'
      - 'dwi_pipeline/containers/deep_atropos_seg/**'
      - 'dwi_pipeline/scripts/run_deep_atropos_seg.py'
      - 'dwi_pipeline/scripts/convert_deep_atropos_to_5tt.py'
      - 'dwi_pipeline/scripts/ci_stage_act_build_context.sh'
      - 'dwi_pipeline/containers/vbt/Dockerfile'
      - 'dwi_pipeline/release_manifest.json'
      - '.github/workflows/act_containers_publish.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (e.g. 0.3.0)
        type: string
        default: "0.3.0"
      push_dockerhub:
        description: Also push to Docker Hub (requires DOCKERHUB_* secrets)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || '0.3.0' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dkt-lesion-act
            context: dwi_pipeline/containers/lesion_act/build_ctx
            dockerfile: dwi_pipeline/containers/lesion_act/Dockerfile
            stage: lesion_act
          - name: dkt-deep-atropos
            context: dwi_pipeline/containers/deep_atropos/build_ctx
            dockerfile: dwi_pipeline/containers/deep_atropos/Dockerfile
            stage: deep_atropos
          - name: dkt-deep-atropos-seg
            context: dwi_pipeline/containers/deep_atropos_seg/build_ctx
            dockerfile: dwi_pipeline/containers/deep_atropos_seg/Dockerfile
            stage: deep_atropos_seg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dh_creds
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dh_creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage build context
        run: bash dwi_pipeline/scripts/ci_stage_act_build_context.sh "${{ matrix.stage }}"

      - name: Compose tags
        id: tags
        run: |
          ghcr="ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}"
          echo "ghcr=${ghcr}" >> "$GITHUB_OUTPUT"
          tags="${ghcr}"
          if [[ "${{ steps.dh_creds.outputs.present }}" == "true" ]]; then
            want_dh=false
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_dockerhub }}" == "true" ]]; then
              want_dh=true
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              want_dh=true
            fi
            if [[ "${want_dh}" == "true" ]]; then
              tags="${tags},phindagijimana321/${{ matrix.name }}:${{ env.IMAGE_TAG }}"
            fi
          fi
          echo "list=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Smoke test (--help)
        run: |
          docker run --rm "ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}" --help | head -5

      - name: Summary
        run: |
          echo "- \`ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
