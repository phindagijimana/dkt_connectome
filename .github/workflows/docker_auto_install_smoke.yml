name: Docker auto-install smoke

# Proves the published orchestrator (GHCR) and the DKT_AUTO_INSTALL=1 one-pull path.
# Does not build FROM Docker Hub (anonymous Hub pulls 429 on GitHub-hosted runners).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    paths:
      - 'dwi_pipeline/Dockerfile'
      - 'dwi_pipeline/docker-entrypoint.sh'
      - 'dwi_pipeline/scripts/install.sh'
      - 'dwi_pipeline/app.json'
      - '.github/workflows/docker_auto_install_smoke.yml'
  pull_request:
    paths:
      - 'dwi_pipeline/Dockerfile'
      - 'dwi_pipeline/docker-entrypoint.sh'
      - 'dwi_pipeline/scripts/install.sh'
      - 'dwi_pipeline/app.json'
      - '.github/workflows/docker_auto_install_smoke.yml'

permissions:
  contents: read
  packages: read

jobs:
  published-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve published image
        id: img
        run: |
          version="$(python3 -c "import json; print(json.load(open('dwi_pipeline/app.json'))['PipelineVersion'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/phindagijimana/dkt-connectome:${version}" >> "$GITHUB_OUTPUT"

      - name: Pull published orchestrator (GHCR)
        run: docker pull "${{ steps.img.outputs.image }}"

      - name: docker run --version
        run: |
          got="$(docker run --rm "${{ steps.img.outputs.image }}" --version)"
          echo "got=${got}"
          test "${got}" = "${{ steps.img.outputs.version }}"

      - name: dkt version
        run: |
          got="$(docker run --rm "${{ steps.img.outputs.image }}" dkt version)"
          test "${got}" = "${{ steps.img.outputs.version }}"

  auto-install:
    # Weekly / manual: pull QSIPrep into a cache volume via the published image.
    # Skip on push/PR so every docs merge does not spend 15 minutes on pennlinc/qsiprep.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Resolve published image
        id: img
        run: |
          version="$(python3 -c "import json; print(json.load(open('dwi_pipeline/app.json'))['PipelineVersion'])")"
          echo "image=ghcr.io/phindagijimana/dkt-connectome:${version}" >> "$GITHUB_OUTPUT"

      - name: Regenerate minimal BIDS fixture
        run: python3 dwi_pipeline/tests/fixtures/generate_bids_fixture.py

      - name: Pull published orchestrator (GHCR)
        run: docker pull "${{ steps.img.outputs.image }}"

      - name: Install QSIPrep into a persistent cache volume
        run: |
          docker volume create dkt_ci_sifs
          touch /tmp/license.txt
          docker run --rm \
            -v dkt_ci_sifs:/opt/dkt-connectome/containers \
            -e DKT_CONTAINER_CACHE=/opt/dkt-connectome/containers \
            "${{ steps.img.outputs.image }}" \
            install --mode qsiprep --missing-only --no-doctor

      - name: Dry-run participant (same cache)
        run: |
          mkdir -p /tmp/docker_out
          docker run --rm \
            -v "${{ github.workspace }}/dwi_pipeline/tests/fixtures/bids_minimal:/data/bids:ro" \
            -v /tmp/docker_out:/out \
            -v /tmp/license.txt:/license.txt:ro \
            -v dkt_ci_sifs:/opt/dkt-connectome/containers \
            -e FS_LICENSE=/license.txt \
            -e BIDS_APP_CI=1 \
            -e DKT_AUTO_INSTALL=0 \
            -e DKT_CONTAINER_CACHE=/opt/dkt-connectome/containers \
            "${{ steps.img.outputs.image }}" \
            /data/bids /out participant \
            --participant-label EXAMPLE --session-filter baseline \
            --mode qsiprep --dry-run --no-sdc --no-dwi-filter

      - name: List cached SIFs
        run: |
          docker run --rm \
            -v dkt_ci_sifs:/opt/dkt-connectome/containers \
            -e DKT_CONTAINER_CACHE=/opt/dkt-connectome/containers \
            "${{ steps.img.outputs.image }}" \
            dkt check --mode qsiprep || true
          docker run --rm \
            -v dkt_ci_sifs:/opt/dkt-connectome/containers \
            ubuntu:24.04 \
            ls -lh /opt/dkt-connectome/containers
